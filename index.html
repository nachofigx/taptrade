<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tapline — practice</title>
<style>
  :root { --bg:#0a0d14; --panel:#121723; --line:#232b3d; --text:#e8ecf5; --dim:#7d8aa5; --accent:#5ef2d0; --win:#4ade80; --loss:#fb7185; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.3 system-ui, -apple-system, Segoe UI, sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .bar { position:fixed; top:0; left:0; right:0; display:flex; gap:14px; align-items:center; padding:10px 14px; background:linear-gradient(#0a0d14ee,#0a0d1400); flex-wrap:wrap; pointer-events:none; }
  .bar > * { pointer-events:auto; }
  .brand { font-weight:800; letter-spacing:.12em; color:var(--accent); }
  .badge { font-size:11px; padding:3px 8px; border:1px solid var(--line); border-radius:99px; color:var(--dim); background:var(--panel); }
  select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover, select:hover { border-color:#3a4766; }
  button.on { border-color:var(--accent); color:var(--accent); }
  .grow { flex:1; }
  .stat { text-align:right; } .stat small { display:block; color:var(--dim); font-size:11px; }
  .stat b { font-size:18px; font-variant-numeric:tabular-nums; }
  .stakes { display:flex; gap:6px; align-items:center; } .stakes span { color:var(--dim); font-size:12px; }
  #log { position:fixed; left:14px; bottom:14px; width:230px; display:flex; flex-direction:column-reverse; gap:4px; pointer-events:none; }
  #log div { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-variant-numeric:tabular-nums; display:flex; justify-content:space-between; animation:in .25s; }
  #log .w { color:var(--win); } #log .l { color:var(--loss); }
  @keyframes in { from { opacity:0; transform:translateY(8px);} }
  #msg { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--dim); font-size:16px; pointer-events:none; }
  #foot { position:fixed; right:14px; bottom:10px; font-size:11px; color:var(--dim); text-align:right; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <span class="brand">TAPLINE</span>
  <span class="badge">PRACTICE · sin dinero real</span>
  <select id="asset"><option>SOL-USD</option><option>BTC-USD</option><option>ETH-USD</option></select>
  <div class="stat"><small>Precio</small><b id="price">—</b></div>
  <div class="grow"></div>
  <div class="stakes"><span>Apuesta</span><span id="stakes"></span></div>
  <div class="stat"><small>Saldo</small><b id="bal">—</b></div>
  <button id="reset" title="Reiniciar saldo a $1,000">↺</button>
</div>
<div id="log"></div>
<div id="msg">Conectando al precio en vivo…</div>
<div id="foot">Toca una casilla: si el precio la toca dentro de su ventana de tiempo, cobras la apuesta × el multiplicador.<br>Precios de Coinbase · saldo ficticio</div>
<script type="module" src="main.js"></script>
</body>
</html>
