<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070a12">
<title>Tapline — practice</title>
<style>
  :root {
    --bg:#070a12; --glass:rgba(16,22,36,.72); --card:#0f1522; --line:rgba(255,255,255,.08);
    --text:#eef2fb; --dim:#8693b0; --accent:#5ef2d0; --accent2:#9b8cff; --win:#4ade80; --loss:#fb7185;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; color:var(--text); overflow:hidden;
    font:14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings:"tnum" 1;
    background:
      radial-gradient(900px 500px at 30% 45%, rgba(94,242,208,.07), transparent 70%),
      radial-gradient(800px 600px at 90% 100%, rgba(155,140,255,.07), transparent 70%),
      linear-gradient(#0a0f1c, var(--bg)); }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }

  .bar { position:fixed; top:0; left:0; right:0; z-index:2; display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.14em; font-size:13px; }
  .brand svg { width:22px; height:22px; }
  .brand span { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .badge, .live, .price small, .price b { white-space:nowrap; }
  .badge { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:99px; color:var(--dim); border:1px solid var(--line); }
  .tabs, .stakes { display:flex; padding:3px; gap:2px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:11px; }
  .tabs button, .stakes button { border:0; background:transparent; color:var(--dim); padding:6px 12px; border-radius:8px; font:600 13px inherit; font-family:inherit; cursor:pointer; transition:.15s; }
  .tabs button:hover, .stakes button:hover { color:var(--text); }
  .tabs button.on, .stakes button.on { background:linear-gradient(135deg,rgba(94,242,208,.22),rgba(155,140,255,.22)); color:#fff; box-shadow:inset 0 0 0 1px rgba(94,242,208,.35); }
  .grow { flex:1; }
  .price { display:flex; align-items:baseline; gap:10px; }
  .price b { font-size:26px; font-weight:700; letter-spacing:-.01em; transition:color .3s; }
  .price b.up { color:var(--win); } .price b.down { color:var(--loss); }
  .price small { font-size:12px; font-weight:600; }
  .live { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); letter-spacing:.08em; }
  .live i { width:7px; height:7px; border-radius:50%; background:#f59e0b; }
  .live.ok i { background:var(--win); box-shadow:0 0 0 0 rgba(74,222,128,.6); animation:pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow:0 0 0 0 rgba(74,222,128,0); } }
  .label { font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-right:8px; }
  .bal { text-align:right; padding:5px 12px; border-radius:11px; background:rgba(255,255,255,.04); border:1px solid var(--line); min-width:128px; transition:background .4s, border-color .4s; }
  .bal small { display:block; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .bal b { font-size:18px; font-weight:700; }
  .bal.up { background:rgba(74,222,128,.14); border-color:rgba(74,222,128,.5); }
  .bal.down { background:rgba(251,113,133,.12); border-color:rgba(251,113,133,.45); }
  .streak { display:none; align-items:center; gap:6px; padding:5px 11px; border-radius:99px; font-weight:800; font-size:13px; color:#ffd36b; border:1px solid rgba(255,190,70,.45); background:linear-gradient(135deg,rgba(255,150,40,.25),rgba(255,80,80,.18)); box-shadow:0 0 18px rgba(255,150,40,.25); }
  .streak.on { display:flex; } .streak.pop { animation:spop .45s cubic-bezier(.2,1.6,.4,1); } .streak svg { width:15px; height:15px; }
  @keyframes spop { 0% { transform:scale(.6); } 60% { transform:scale(1.25); } 100% { transform:scale(1); } }
  .icon.muted { color:var(--loss); }
  .lvl { display:flex; flex-direction:column; gap:4px; align-items:stretch; min-width:66px; padding:5px 10px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); cursor:pointer; font:700 12px inherit; font-family:inherit; }
  .lvl:hover { border-color:rgba(255,255,255,.22); }
  .lvl i { display:block; height:4px; border-radius:4px; background:rgba(255,255,255,.1); overflow:hidden; }
  .lvl u { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s; text-decoration:none; }
  #ach { position:fixed; right:16px; top:84px; z-index:4; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  #ach div { width:260px; padding:10px 14px; border-radius:12px; background:var(--glass); backdrop-filter:blur(14px); border:1px solid rgba(255,210,74,.5); box-shadow:0 0 22px rgba(255,210,74,.18); animation:in .35s; font-size:12.5px; }
  #ach b { display:block; color:#ffd24a; font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px; } #ach em { color:var(--accent); font-style:normal; font-weight:700; float:right; }
  #share { position:fixed; right:16px; bottom:44px; z-index:4; display:none; padding:10px 16px; border-radius:99px; border:1px solid rgba(94,242,208,.5); color:var(--text); font:700 13px inherit; font-family:inherit; cursor:pointer; animation:in .35s; }
  #share.on { display:block; } #share:hover { border-color:var(--accent); }
  #prof { position:fixed; inset:0; z-index:6; display:grid; place-items:center; background:rgba(3,6,12,.62); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); } #prof.hide { display:none; }
  .sheet { width:min(740px,94vw); max-height:88vh; overflow:auto; padding:20px 22px; background:#0d1320 !important; }
  .sheet { scrollbar-width:thin; scrollbar-color:#2a3550 transparent; }
  .sheet h2 { margin:0 0 4px; font-size:20px; } .sheet h3 { margin:18px 0 8px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; }
  .xpbar { height:8px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden; margin:8px 0 2px; } .xpbar u { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); text-decoration:none; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
  .tile { padding:10px 12px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.03); font-size:12.5px; } .tile b { display:block; font-size:13px; }
  .tile.got { border-color:rgba(255,210,74,.45); background:rgba(255,210,74,.07); } .tile.got b { color:#ffd24a; } .tile:not(.got) { opacity:.5; }
  .stat4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; } .stat4 .tile { text-align:center; } .stat4 b { font-size:17px; }
  .themes { display:flex; gap:8px; flex-wrap:wrap; } .themes button { padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); font:600 13px inherit; font-family:inherit; cursor:pointer; }
  .themes button.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); } .themes button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; justify-content:space-between; } .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); font:600 13px inherit; font-family:inherit; cursor:pointer; }
  .btn.pri { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06101a; border:0; }
  .icon { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--dim); cursor:pointer; font:600 15px inherit; font-family:inherit; }
  .icon:hover { color:var(--text); border-color:rgba(255,255,255,.2); }

  .card { background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px; }
  #side { position:fixed; left:16px; bottom:16px; width:240px; z-index:2; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  #stats { padding:11px 14px; display:flex; justify-content:space-between; align-items:center; }
  #stats small { display:block; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  #stats b { font-size:16px; } .pos { color:var(--win); } .neg { color:var(--loss); }
  #log { display:flex; flex-direction:column-reverse; gap:5px; }
  #log div { padding:7px 12px; border-radius:10px; display:flex; justify-content:space-between; font-weight:600; font-size:13px; animation:in .3s;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); }
  #log .w { color:var(--win); border-color:rgba(74,222,128,.3); } #log .l { color:var(--loss); border-color:rgba(251,113,133,.25); }
  @keyframes in { from { opacity:0; transform:translateY(10px) scale(.97);} }

  #msg { position:fixed; left:50%; top:52%; transform:translate(-50%,-50%); z-index:1; color:var(--dim); text-align:center; pointer-events:none; }
  #msg:before { content:""; display:block; width:30px; height:30px; margin:0 auto 12px; border-radius:50%; border:3px solid rgba(255,255,255,.1); border-top-color:var(--accent); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; top:78px; transform:translate(-50%,-10px); z-index:3; padding:8px 16px; border-radius:99px; opacity:0; transition:.25s; pointer-events:none; font-weight:600; font-size:13px; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #help { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:3; max-width:min(560px,calc(100vw - 32px)); padding:14px 18px; display:flex; gap:14px; align-items:center; font-size:13px; color:#c9d3ea; }
  #help.hide { display:none; }
  #help b { color:var(--accent); } #help button { flex:none; border:0; border-radius:9px; padding:7px 14px; font:600 13px inherit; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06101a; }
  #foot { position:fixed; right:16px; bottom:10px; z-index:1; font-size:11px; color:rgba(134,147,176,.7); pointer-events:none; }

  @media (max-width:820px) {
    .bar { flex-wrap:wrap; gap:8px 10px; padding:8px 10px; } .badge, .brand span, #foot { display:none; }
    .price b { font-size:20px; } .grow { display:none; } .bal { min-width:0; margin-left:auto; }
    #side { width:170px; left:10px; bottom:10px; } #help { bottom:80px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef2d0"/><stop offset="1" stop-color="#9b8cff"/></linearGradient></defs>
      <rect x="2" y="2" width="9" height="9" rx="2.5" fill="url(#g)" opacity=".35"/><rect x="13" y="2" width="9" height="9" rx="2.5" fill="url(#g)"/>
      <rect x="2" y="13" width="9" height="9" rx="2.5" fill="url(#g)"/><rect x="13" y="13" width="9" height="9" rx="2.5" fill="url(#g)" opacity=".55"/></svg>
    <span>TAPLINE</span>
  </div>
  <div class="badge" title="Saldo ficticio, sin dinero real">Práctica</div>
  <div class="tabs" id="tabs"></div>
  <div class="price"><b id="price">—</b><small id="chg"></small></div>
  <div class="live" id="live"><i></i><span id="livetxt">CONECTANDO</span></div>
  <button class="lvl" id="lvl" title="Perfil, logros y misión diaria"><b id="lvlnum">Nv 1</b><i><u id="lvlbar"></u></i></button>
  <div class="streak" id="streak"></div>
  <div class="grow"></div>
  <div class="stakes" id="stakes"></div>
  <div class="bal" id="balbox"><small>Saldo</small><b id="bal">—</b></div>
  <button class="icon" id="mute" title="Sonido"></button>
  <button class="icon" id="reset" title="Reiniciar saldo a $1,000">↺</button>
  <button class="icon" id="helpbtn" title="Cómo jugar">?</button>
</header>
<div id="side">
  <div class="card" id="stats"><div><small>Sesión</small><b id="pnl">$0.00</b></div><div style="text-align:right"><small>Aciertos</small><b id="wl">0 / 0</b></div></div>
  <div id="log"></div>
</div>
<div id="msg">Conectando al precio en vivo…</div>
<div id="ach"></div>
<button id="share" class="card">Compartir victoria</button>
<div id="prof" class="hide"><div class="sheet card" id="profbody"></div></div>
<div id="toast" class="card"></div>
<div id="help" class="card"><div><b>Cómo jugar.</b> Toca una casilla: si el precio la toca dentro de su columna de tiempo, cobras <b>apuesta × multiplicador</b>. Más lejos del precio paga más. Saldo ficticio, precio real.</div><button id="helpok">Entendido</button></div>
<div id="foot">Precios en vivo de Coinbase</div>
<script type="module" src="main.js?v=9"></script>
</body>
</html>
